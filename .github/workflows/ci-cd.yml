name: DespliegaUML CI/CD

# Cada push a main y cada pull request:
#   1. ejecuta la suite de pruebas (bloquea el despliegue si falla)
#   2. regenera los diagramas y el manual técnico desde el modelo
#   3. renderiza los .puml a SVG e inserta las imágenes en el README
#   4. publica la aplicación y la documentación en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Suite de pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar la suite de pruebas
        run: node app/tests/casos.js

      - name: Verificar la coherencia de los modelos de ejemplo
        run: |
          node -e "
          const fs=require('fs'),vm=require('vm');
          ['modelo.js','reglas.js','plan.js','pruebas.js','puml.js']
            .forEach(f=>vm.runInThisContext(
              fs.readFileSync('app/src/'+f,'utf8'),{filename:f}));
          const DPL=globalThis.DPL;
          const m=DPL.Modelo.normalizar(
            JSON.parse(fs.readFileSync('app/ejemplos/aplicacion-web-3niveles.json','utf8')));
          const v=DPL.validar(m);
          console.log('Validación:', JSON.stringify(v.resumen));
          if (!v.valido) {
            console.error('El modelo de ejemplo no cumple las reglas:');
            v.hallazgos.filter(h=>h.severity||h.severidad==='error')
             .forEach(h=>console.error(' -',h.regla,h.mensaje));
            process.exit(1);
          }
          console.log('El modelo de ejemplo cumple las '+v.reglasEvaluadas+' reglas.');
          "

  documentacion:
    name: Generar documentación y diagramas
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Graphviz
        run: |
          # PlantUML delega el trazado a Graphviz; sin él no produce SVG.
          sudo apt-get update -qq
          sudo apt-get install -y -qq graphviz
          dot -V

      - name: Instalar PlantUML
        run: |
          # Versión fijada: la del apt en ubuntu-latest es anterior y rechaza
          # la sintaxis de puertos que usa el generador. Un jar con la misma
          # versión que se verificó en local elimina esa diferencia.
          PLANTUML_VERSION=1.2024.7
          curl -sSL -o plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          java -jar plantuml.jar -version | head -2

      - name: Generar la documentación técnica
        run: node tools/generar-documentacion.js

      - name: Renderizar los diagramas a SVG
        run: |
          # -o doc/ deja el SVG junto al .puml; -tsvg fuerza el formato.
          # PlantUML nombra la salida con el nombre declarado en @startuml
          # (no con el del archivo), así que se renombra al final.
          java -jar plantuml.jar -tsvg -o doc doc/diagrama-componentes.puml doc/diagrama-despliegue.puml
          for sv in doc/*.svg; do
            base=$(basename "$sv")
            case "$base" in
              diagrama-componentes.svg|diagrama-despliegue.svg) : ;;
              *componentes*) mv -f "$sv" doc/diagrama-componentes.svg ;;
              *despliegue*)  mv -f "$sv" doc/diagrama-despliegue.svg ;;
            esac
          done
          ls -la doc/*.svg
          test -s doc/diagrama-componentes.svg || { echo "::error::no se generó el diagrama de componentes"; exit 1; }
          test -s doc/diagrama-despliegue.svg || { echo "::error::no se generó el diagrama de despliegue"; exit 1; }

      - name: Adjuntar los artefactos generados
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-despliegauml
          path: |
            doc/
          retention-days: 90

  publicar:
    name: Publicar en GitHub Pages
    needs: documentacion
    # Publica en los pushes a main y también cuando se lanza a mano
    # (workflow_dispatch), que es lo que permite republicar sin un commit.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar la documentación
        run: node tools/generar-documentacion.js

      - name: Preparar el directorio de publicación
        run: |
          rm -rf _site
          mkdir -p _site
          # La aplicación se publica en la raíz del sitio: sus rutas relativas
          # (css/, src/) son absolutas respecto a index.html, de modo que
          # copiar su contenido —no el archivo suelto— mantiene la carga.
          cp -r app/. _site/
          # además se conserva con su carpeta de pruebas y ejemplos
          mkdir -p _site/app
          cp -r app/. _site/app/
          # La documentación en /doc
          mkdir -p _site/doc
          cp -f doc/*.md doc/*.svg doc/*.puml _site/doc/ 2>/dev/null || true
          # Los informes del proyecto
          mkdir -p _site/informes
          cp -f FD*.docx _site/informes/ 2>/dev/null || true
          cp -f unidad1/Proyecto-de-Unidad-1.pdf _site/informes/ 2>/dev/null || true
          # La portada se guarda aparte y luego sustituye al index de la app,
          # que queda accesible como index-app.html.
          mv _site/index.html _site/index-app.html
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>DespliegaUML</title>
          <style>
            body{font-family:"Segoe UI",system-ui,sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:32px}
            main{max-width:760px;margin:0 auto}
            h1{color:#0f766e;margin:0 0 4px}
            .sub{color:#64748b;margin:0 0 28px}
            a.b{display:inline-block;background:#0f766e;color:#fff;text-decoration:none;
               padding:12px 20px;border-radius:8px;margin:6px 8px 6px 0;font-weight:600}
            a.b.sec{background:#fff;color:#0f766e;border:1px solid #cbd5e1}
            a.b:hover{background:#115e59}
            h2{margin-top:32px;font-size:16px;color:#0f766e}
            ul{line-height:1.9}
          </style></head><body><main>
          <h1>▲ DespliegaUML</h1>
          <p class="sub">Diagramador de componentes y despliegue de software con
          validación de reglas y plan de despliegue</p>
          <a class="b" href="index-app.html">Abrir la aplicación</a>
          <a class="b sec" href="app/index.html">Abrir en su carpeta</a>
          <a class="b sec" href="doc/manual-tecnico.md">Manual técnico</a>
          <a class="b sec" href="doc/plan-despliegue.md">Plan de despliegue</a>
          <h2>Documentación</h2>
          <ul>
            <li><a href="doc/catalogo-reglas.md">Catálogo de reglas de consistencia</a></li>
            <li><a href="doc/informe-calidad.md">Informe de calidad</a></li>
            <li><a href="doc/diagrama-componentes.svg">Diagrama de componentes</a></li>
            <li><a href="doc/diagrama-despliegue.svg">Diagrama de despliegue</a></li>
            <li><a href="app/README.md">Manual de uso de la aplicación</a></li>
            <li>Informes del proyecto (FD01 a FD04) en el repositorio</li>
          </ul>
          </main></body></html>
          HTML
          find _site -maxdepth 1 | sort
          echo "--- comprobación de la estructura publicada ---"
          test -f _site/index.html             || { echo "::error::falta la portada"; exit 1; }
          test -f _site/index-app.html         || { echo "::error::falta la aplicación"; exit 1; }
          test -f _site/css/estilos.css        || { echo "::error::falta el CSS"; exit 1; }
          test -f _site/src/modelo.js          || { echo "::error::falta el código"; exit 1; }
          test -f _site/doc/manual-tecnico.md  || { echo "::error::falta la documentación"; exit 1; }
          test -s _site/doc/diagrama-componentes.svg || { echo "::error::falta el diagrama de componentes"; exit 1; }
          test -s _site/doc/diagrama-despliegue.svg  || { echo "::error::falta el diagrama de despliegue"; exit 1; }
          echo "estructura de publicación correcta"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Publicar
        id: deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Comprobar la publicación
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          # upload-pages-artifact no expone page_url; la URL se deriva del
          # repositorio si el valor viene vacío.
          url="$PAGE_URL"
          if [ -z "$url" ] || [ "$url" = "" ]; then
            url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "URL de publicación: $url"
          # Pages puede tardar unos segundos en servir el primer despliegue.
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url" 2>/dev/null || echo 000)
            echo "intento $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "::notice::Sitio publicado correctamente en $url"
              exit 0
            fi
            sleep 10
          done
          {
            echo "::warning::El artefacto se publicó, pero $url aún no responde 200."
            echo "::warning::Si el entorno github-pages tiene una regla de ramas que no incluye main, el despliegue queda en cola."
            echo "::warning::Revisa Settings → Environments → github-pages → Deployment branches y añade main, o cambia la política a All branches."
            echo "::warning::El procedimiento completo está en doc/Despliegue.md"
          }

  resumen:
    name: Resumen
    needs: [pruebas, documentacion]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Descargar los artefactos generados
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: documentacion-despliegauml
          path: doc

      - name: Resultado
        run: |
          echo "### Resultado de la integración continua" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Etapa | Estado |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :- | :- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pruebas | ${{ needs.pruebas.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Documentación | ${{ needs.documentacion.result }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f doc/informe-calidad.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '<details><summary>Informe de calidad</summary>' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat doc/informe-calidad.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          fi
